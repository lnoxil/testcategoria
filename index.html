<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тесты по транспортной безопасности</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Тренажёр тестов</h1>
    <div class="controls">
      <label>Категория
        <select id="categorySelect"></select>
      </label>
      <label>Количество вопросов
        <input id="countInput" type="number" min="1" value="20" />
      </label>
      <button id="startBtn">Начать тест</button>
    </div>

    <section id="quiz" class="hidden">
      <div id="progress"></div>
      <h2 id="questionText"></h2>
      <form id="optionsForm"></form>
      <div class="quiz-actions">
        <button id="nextBtn" type="button">Далее</button>
      </div>
    </section>

    <section id="result" class="hidden"></section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
